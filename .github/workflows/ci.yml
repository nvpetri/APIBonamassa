name: API checks
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: bonamassa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bonamassa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bonamassa -d bonamassa_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bonamassa:ci-only-password@localhost:5432/bonamassa_test
      TEST_DATABASE_URL: postgresql://bonamassa:ci-only-password@localhost:5432/bonamassa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run check
      - run: npm run test:integration
