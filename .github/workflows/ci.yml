name: API checks
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: bonamassa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bonamassa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bonamassa -d bonamassa_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SCHEDULER_INTERVAL_SECONDS: "0"
      NODE_ENV: test
      DATABASE_URL: postgresql://bonamassa:ci-only-password@localhost:5432/bonamassa_test
      TEST_DATABASE_URL: postgresql://bonamassa:ci-only-password@localhost:5432/bonamassa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run db:migrate
      - run: npm test
      - run: npm run check
      - name: Show formatting corrections
        if: failure()
        run: |
          npx --no-install prettier --write .
          git diff
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Verify encrypted PostgreSQL backup and isolated restore
        env:
          BACKUP_DATABASE_URL: postgresql://bonamassa:ci-only-password@localhost:5432/bonamassa_test?sslmode=disable
          BACKUP_ENCRYPTION_KEY: ci-only-encryption-key-never-use-for-real-backups
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: bonamassa
          PGPASSWORD: ci-only-password
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          psql -d bonamassa_test -v ON_ERROR_STOP=1 -c 'CREATE TABLE "BackupProbe" (id int PRIMARY KEY, value text NOT NULL); INSERT INTO "BackupProbe" VALUES (1, $$backup-data-roundtrip$$);'
          node scripts/backup.mjs
          encrypted=$(find backup-output -name '*.dump.enc' -print -quit)
          node scripts/decrypt-backup.mjs "$encrypted" "$RUNNER_TEMP/recovered.dump"
          createdb bonamassa_restore_test
          pg_restore --dbname bonamassa_restore_test --no-owner --no-acl --exit-on-error "$RUNNER_TEMP/recovered.dump"
          source_count=$(psql -d bonamassa_test -Atc 'SELECT count(*) FROM "_prisma_migrations"')
          restored_count=$(psql -d bonamassa_restore_test -Atc 'SELECT count(*) FROM "_prisma_migrations"')
          test "$source_count" -gt 0
          test "$source_count" = "$restored_count"
          test "$(psql -d bonamassa_restore_test -Atc 'SELECT value FROM "BackupProbe" WHERE id = 1')" = "backup-data-roundtrip"
          psql -d bonamassa_test -v ON_ERROR_STOP=1 -c 'DROP TABLE "BackupProbe"'
          rm -f "$RUNNER_TEMP/recovered.dump"
      - run: npm run test:integration
      - name: Verify deployment startup in Docker
        timeout-minutes: 5
        env:
          NODE_ENV: production
          APP_ENV: test
          DATABASE_URL: postgresql://bonamassa:ci-only-password@localhost:5432/bonamassa_startup_test
          CORS_ORIGINS: ""
          SEED_STORE_SLUG: bonamassa-startup
          SEED_MANAGER_EMAIL: startup@example.test
          SEED_MANAGER_PASSWORD: ci-only-startup-password
          SEED_DEMO: "false"
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U bonamassa bonamassa_startup_test
          docker build -t bonamassa-startup-test .
          trap 'docker logs bonamassa-startup-test; docker rm -f bonamassa-startup-test' EXIT
          docker run -d --name bonamassa-startup-test --network host \
            -e NODE_ENV -e APP_ENV -e DATABASE_URL -e CORS_ORIGINS -e PORT=3001 \
            -e SEED_STORE_SLUG -e SEED_MANAGER_EMAIL -e SEED_MANAGER_PASSWORD -e SEED_DEMO \
            bonamassa-startup-test npm run start:deploy
          curl --fail --silent --show-error --retry 30 --retry-all-errors \
            --retry-delay 1 --retry-max-time 60 --max-time 5 \
            http://127.0.0.1:3001/v1/health
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const health = await fetch('http://127.0.0.1:3001/v1/health');
          assert.equal((await health.json()).status, 'ok');
          const response = await fetch('http://127.0.0.1:3001/v1/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              storeSlug: process.env.SEED_STORE_SLUG,
              email: process.env.SEED_MANAGER_EMAIL,
              password: process.env.SEED_MANAGER_PASSWORD,
            }),
          });
          assert.equal(response.status, 200);
          const session = await response.json();
          assert.equal(session.user.role, 'MANAGER');
          assert.ok(session.accessToken);
          console.log('Deployment startup: migrations, health check and manager login passed.');
          NODE
