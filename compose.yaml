services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: bonamassa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: bonamassa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonamassa -d bonamassa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bonamassa:${POSTGRES_PASSWORD}@db:5432/bonamassa?schema=public
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
